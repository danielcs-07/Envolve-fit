name: Validar regras Firestore
on:
  pull_request:
    paths:
      - "firestore.session-drafts.rules"
      - "tests/firestore-isolation.emulator.mjs"
      - "tests/firebase-emulator.json"
      - ".github/workflows/firestore-security.yml"
  workflow_dispatch:

jobs:
  test-firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Instalar ferramentas de teste
        run: npm install --no-save --no-package-lock firebase@12.4.0 @firebase/rules-unit-testing@5 firebase-tools@14
      - name: Testar regras reais com Firestore Emulator
        run: npx firebase emulators:exec --only firestore --project demo-evolve-fit --config tests/firebase-emulator.json "node --test tests/firestore-isolation.emulator.mjs"
