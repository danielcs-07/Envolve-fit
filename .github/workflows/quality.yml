name: Validar Evolve Fit
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir sintaxe dos scripts
        run: |
          for file in assets/js/aluno.js assets/js/treinador.js assets/js/auth-ui.js assets/js/aprovacao.js assets/js/firebase-config.js assets/js/fitness-utils.mjs assets/js/pwa.js sw.js assets/js/login-enhancements.js; do
            node --input-type=module --check < "$file"
          done
      - name: Testar regras de calendário e contratos das telas
        run: node --test tests/*.test.mjs
