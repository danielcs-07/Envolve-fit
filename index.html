
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolve Fit | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-page">
        <div class="login-container">
            <div class="login-brand">
                <div class="login-icon">💪</div>
                <h1>Evolve Fit</h1>
                <p>Sua evolução começa aqui.</p>
            </div>

            <section class="login-card">
                <h2 id="form-title">Bem-vindo de volta!</h2>
                <p id="form-subtitle">
                    Entre na sua conta para continuar.
                </p>

                <form id="auth-form">
                    <div class="form-group" id="name-group" hidden>
                        <label for="name">Nome completo</label>
                        <input type="text" id="name"
                        placeholder="Seu nome completo">
                    </div>

                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email"
                        placeholder="seuemail@exemplo.com"
                        autocomplete="email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Senha</label>
                        <input type="password" id="password"
                        placeholder="Digite sua senha"
                        autocomplete="current-password" required>
                    </div>

                    <p id="auth-message" role="status"></p>

                    <button type="submit" class="btn auth-btn"
                    id="submit-btn">
                        Entrar na minha conta
                    </button>
                </form>

                <p class="auth-switch">
                    <span id="switch-text">
                        Ainda não tem uma conta?
                    </span>
                    <button type="button" id="switch-btn">
                        Criar conta
                    </button>
                </p>
            </section>

            <p class="login-footer">
                © 2026 Evolve Fit
            </p>
        </div>
    </main>

    <script type="module" src="auth-ui.js"></script>
</body>
</html>
