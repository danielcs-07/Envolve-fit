
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="Evolve Fit - Plataforma de treinos personalizados e acompanhamento físico">
  <title>Entrar | Evolve Fit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

  <main class="login-container">
    <div class="login-brand">
      <div class="login-logo">💪</div>
      <h1>Evolve Fit</h1>
      <p>Seu treino. Sua evolução. Seus resultados.</p>
    </div>

    <section class="login-card">
      <div class="login-heading">
        <h2 id="form-title">Bem-vindo de volta!</h2>
        <p id="form-subtitle">
          Entre na sua conta para continuar evoluindo.
        </p>
      </div>

      <form id="auth-form">

        <div id="name-group" class="form-group" hidden>
          <label for="name">Nome completo</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Digite seu nome completo"
            autocomplete="name"
            maxlength="100"
          >
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="exemplo@email.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            minlength="6"
            required
          >
        </div>

        <button id="submit-btn" class="primary-btn" type="submit">
          Entrar na minha conta
        </button>

        <p id="auth-message" class="auth-message" role="status"></p>
      </form>

      <div class="login-switch">
        <span id="switch-text">Ainda não tem uma conta?</span>
        <button id="switch-btn" type="button">
          Criar conta
        </button>
      </div>
    </section>

    <footer class="login-footer">
      <p>© 2026 Evolve Fit. Evolua todos os dias. 💙</p>
    </footer>
  </main>

  <script type="module" src="auth-ui.js"></script>
</body>
</html>
